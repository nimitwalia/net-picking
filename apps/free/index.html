<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Net-picking">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Net-picking</title>
<link rel="stylesheet" href="./src/fonts.css">
<style>
/* Layout: one column, black ground; cream/pastel surfaces carry every interactive element */
:root{
  color-scheme:dark;
  --bg:#0b0b0a;--surface:#141413;--surface2:#1d1c1a;--line:#2c2a26;
  --cream:#f4ecd8;--peach:#f5cfb0;--sage:#cfe2c2;--butter:#f3e3a6;--blush:#eebdb4;--sky:#c9dde6;
  --ink:#f4ecd8;--muted:#9b9486;--on-cream:#1a1814;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bar-h:61px;--bar-space:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:calc(var(--bar-space) + 12px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(11,11,10,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 i{font-style:normal;color:var(--peach)}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(48px + var(--bar-space))}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));transition:none}
body:has(input:focus,textarea:focus,select:focus) nav{transform:translateY(calc(100% + 2px));pointer-events:none}
nav button{border:0;background:transparent;color:var(--muted);min-height:44px;padding:10px 4px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button.active{background:var(--cream);color:var(--on-cream);font-weight:700}
nav button:disabled{opacity:.35;cursor:not-allowed}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h2.t{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
.lede{color:var(--muted);margin:0 0 18px;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
textarea,select,input[type=number]{width:100%;background:var(--cream);color:var(--on-cream);border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{min-height:170px;resize:vertical;line-height:1.6}
textarea::placeholder,input::placeholder{color:#8b8471}
select{background-image:linear-gradient(45deg,transparent 50%,#1a1814 50%),linear-gradient(135deg,#1a1814 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}

.btn{background:var(--cream);color:var(--on-cream);border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.peach{background:var(--peach)}
.btn.small{padding:8px 14px;font-size:13px}
.rulelinks{display:flex;flex-direction:column;gap:10px}
.rulelink{display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;max-width:100%;text-align:center;text-decoration:none;overflow-wrap:anywhere}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* scoring setup */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:999px;font-size:14px;font-weight:600}
.seg button.on{background:var(--cream);color:var(--on-cream)}
.pts-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pts-row button{border:0;border-radius:14px;padding:12px 0;background:var(--surface2);color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px}
.pts-row button.on{background:var(--peach);color:var(--on-cream)}
.rchip{display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--cream);font-family:var(--mono);letter-spacing:.02em}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px 5px 6px;font-size:13px;font-weight:500;color:var(--on-cream);max-width:100%}
.chip b{width:20px;height:20px;border-radius:50%;background:rgba(26,24,20,.14);display:grid;place-items:center;font-size:11px;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border-radius:16px;padding:12px;color:var(--on-cream);min-width:0}
.stat small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.stat b{font-family:var(--display);font-size:26px;line-height:1.1;font-weight:800}

.note{font-size:13px;margin:10px 0 0;padding:10px 12px;border-radius:12px;color:var(--on-cream)}
.note.err{background:var(--blush)}
.note.warn{background:var(--butter)}
.note.ok{background:var(--sage)}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}

.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog .bar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog .bar div{height:100%;background:var(--cream);border-radius:99px;transition:width .3s}
.prog span{font-family:var(--mono);font-size:12px;color:var(--muted)}

.mcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;scroll-margin-top:84px;scroll-margin-bottom:calc(var(--bar-space) + 12px)}
.mcard.next{border-color:var(--cream)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mno{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted)}
.pill.next{background:var(--cream);color:var(--on-cream)}
.pill.done{background:var(--sage);color:var(--on-cream)}
.teams,.scorebox{display:grid;grid-template-columns:1fr 26px 1fr;gap:6px;align-items:stretch}
.team{background:var(--surface2);border:1.5px solid var(--line);border-radius:16px;color:var(--ink);padding:12px 8px;text-align:center;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.team .n{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .amp{font-size:11px;color:var(--muted)}
.team small{display:block;margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.team.win{background:var(--sage);border-color:var(--sage);color:var(--on-cream)}
.team.win .amp,.team.win small{color:#3d4a36}
.team.lose{background:transparent;border-color:var(--blush);color:var(--blush)}
.team.lose .amp,.team.lose small{color:var(--blush);opacity:.85}
.vs{align-self:center;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.scorebox{margin-top:10px;align-items:center}
.scorebox input{text-align:center;font-family:var(--mono);font-size:24px;padding:10px 4px;border-radius:14px}
.scorebox .dash{text-align:center;color:var(--muted)}
.rhint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:.02em}
.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{flex:1}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pod{border-radius:18px;padding:12px 10px;color:var(--on-cream);min-width:0;text-align:center}
.pod .r{font-family:var(--mono);font-size:11px;opacity:.7}
.pod .nm{font-weight:700;font-size:14px;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pp{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.pod.p1{background:var(--butter)}.pod.p2{background:var(--cream)}.pod.p3{background:var(--peach)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 5px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.name,th.name{text-align:left}
td.name{font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:var(--mono);font-size:12px;color:var(--muted)}
tr.top4 .rk{background:var(--cream);color:var(--on-cream);font-weight:700}
tr.cut td{border-bottom:2px dashed var(--peach)}
.up{color:var(--sage);font-size:11px}.down{color:var(--blush);font-size:11px}
.pts{font-family:var(--display);font-weight:800;font-size:17px}

.seedgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.champ{background:var(--cream);color:var(--on-cream);border-radius:24px;padding:26px 16px;text-align:center;margin-bottom:14px}
.champ .cup{width:54px;height:54px;margin:0 auto 6px}
.champ h3{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:4px 0 0;line-height:1.1}
.champ .sc{font-family:var(--mono);margin-top:8px;color:#5d5646}
.hidden{display:none}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--cream);color:var(--on-cream);border-radius:22px;padding:20px;max-width:400px;width:100%}
.modal p{margin:0 0 16px;font-size:16px;font-weight:500}
.modal .row{justify-content:flex-end}
.modal .btn{background:var(--on-cream);color:var(--cream)}
.modal .btn.ghost{background:transparent;color:var(--on-cream);border-color:rgba(26,24,20,.25)}
.modal .box.dark{background:var(--surface);color:var(--ink);border:1px solid var(--line);max-height:92vh;overflow:auto;padding:14px}
.modal .box.dark img{width:100%;height:auto;border-radius:14px;display:block;margin-bottom:12px}
.modal .box.dark .btn{background:var(--cream);color:var(--on-cream);text-decoration:none;display:inline-block;text-align:center}
.modal .box.dark .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.modal .box.dark .row{justify-content:flex-start}
.modal .box.dark .hint{margin:10px 0 0;font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="modal" class="modal" hidden><div class="box"><p id="mtext"></p><div class="row"><button class="btn ghost" data-act="mNo">Cancel</button><button class="btn" data-act="mYes">Confirm</button></div></div></div>
<div id="imgModal" class="modal" hidden><div class="box dark"><img id="shareImg" alt="Net-picking final result"><div class="row"><a id="dl" class="btn" download="net-picking-result.png" href="#">Download</a><button class="btn ghost" data-act="imgClose">Close</button></div><p class="hint" id="shareHint"></p></div></div>
<header>
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><g transform="rotate(-38 15 15)"><rect x="12.6" y="18.5" width="4.8" height="11" rx="2.2" fill="#f4ecd8"/><rect x="12.6" y="22.5" width="4.8" height="1.6" fill="#1a1814" opacity=".25"/><rect x="5" y="1.5" width="20" height="21" rx="9" fill="#f5cfb0"/><rect x="8" y="4.5" width="14" height="15" rx="6" fill="none" stroke="#1a1814" stroke-opacity=".18" stroke-width="1"/><g fill="#1a1814" fill-opacity=".3"><circle cx="15" cy="8" r="1"/><circle cx="11.5" cy="11" r="1"/><circle cx="18.5" cy="11" r="1"/><circle cx="15" cy="14" r="1"/></g></g><circle cx="29" cy="28" r="8" fill="#f3e3a6"/><g fill="#1a1814"><circle cx="29" cy="23.6" r="1.25"/><circle cx="25.2" cy="26.2" r="1.25"/><circle cx="32.8" cy="26.2" r="1.25"/><circle cx="29" cy="28.6" r="1.25"/><circle cx="25.6" cy="31.4" r="1.25"/><circle cx="32.4" cy="31.4" r="1.25"/></g></svg>
    <h1>Net<i>-picking</i></h1>
  </div>
  <button class="btn ghost small" data-act="newTournament">New</button>
</header>
<main>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
